name: E2E Nightly

# Headless GTK GUI smoke test (Xvfb) — slower and more environment-dependent
# than the rest of CI, so it runs on a schedule / on demand instead of
# blocking every push and PR. See ci.yml for the gates that do block merges.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  e2e-headless:
    name: Headless GUI E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            xauth \
            dbus-x11 \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgraphene-1.0-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/e2e-headless-smoke.sh
