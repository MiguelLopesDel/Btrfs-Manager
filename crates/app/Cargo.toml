[package]
name = "btrfs-manager-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
gui = ["dep:gtk4", "dep:gio", "dep:libadwaita", "dep:ureq"]

[dependencies]
anyhow.workspace = true
btrfs-manager-helper = { path = "../helper" }
btrfs-manager-core = { path = "../core" }
clap.workspace = true
gtk4 = { version = "0.10", optional = true }
gio = { version = "0.21", optional = true }
libadwaita = { version = "0.8", optional = true, features = ["v1_5"] }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
zbus.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Uses the OS's own trust store (platform-verifier) rather than bundling
# Mozilla's CA list (the default `rustls` feature's webpki-roots), which is
# both more appropriate for a Linux system utility and avoids a CDLA-licensed
# dependency our license allowlist doesn't cover.
ureq = { version = "3.4", optional = true, default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
    "gzip",
] }
